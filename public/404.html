    <meta name="robots" content="noindex, nofollow" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #020c4c;
        --color-secondary: #0b4887;
        --color-text-main: #333333;
        --color-text-light: #666666;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
        color: var(--color-text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }
      .container {
        max-width: 600px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 1rem;
        background: rgba(11, 72, 135, 0.08);
        border: 1px solid rgba(11, 72, 135, 0.18);
        border-radius: 50px;
        color: var(--color-secondary);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }
      .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #ef4444;
      }
      .error-code {
        font-family: 'Poppins', sans-serif;
        font-size: clamp(5rem, 15vw, 8rem);
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, #020c4c 0%, #0b4887 60%, #1e88e5 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: clamp(1.85rem, 4.5vw, 2.5rem);
        font-weight: 800;
        color: var(--color-primary);
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 2.2rem;
        background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        border-radius: 50px;
        box-shadow: 0 4px 14px rgba(2, 12, 76, 0.25);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(2, 12, 76, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">
        <span class="badge-dot"></span>
        Error 404
      </div>
      <div class="error-code">404</div>

        Back to Home
      </a>
    </div>
